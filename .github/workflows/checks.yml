name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r backend/requirements-test.txt
      - run: mkdir -p .build
      - run: python -B -m unittest discover -s backend -v
      - run: node --test backend/voice_test/controller.test.mjs backend/voice_test/research.test.mjs
      - run: python scripts/check_public_release.py --tracked
      - run: python scripts/test_public_release.py
